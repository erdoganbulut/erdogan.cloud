<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Content layers</title>
  <desc id="desc">Offset monochrome rectangles representing layers of content.</desc>
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <g fill="none" stroke-width="2">
    <rect x="160" y="90" width="640" height="360" stroke="#3f3f3f"/>
    <rect x="240" y="150" width="640" height="360" stroke="#777"/>
    <rect x="320" y="210" width="640" height="360" stroke="#f5f5f5"/>
  </g>
  <circle cx="960" cy="150" r="42" fill="#f5f5f5"/>
  <circle cx="240" cy="510" r="18" fill="#777"/>
</svg>
