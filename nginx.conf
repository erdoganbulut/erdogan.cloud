server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ponytail: minimal static nginx for Coolify/DigitalOcean. Headers + immutable cache for hashed assets.
    # Requires Dockerfile: COPY dist /usr/share/nginx/html  +  COPY nginx.conf /etc/nginx/conf.d/default.conf

    # security headers (static site, no embeds)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS only if behind HTTPS (Traefik/Cloudflare terminates TLS) — enable if you serve https directly:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # hashed Astro assets — immutable
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /favicon.ico { try_files $uri =404; access_log off; }
    location = /og-image.png { add_header Cache-Control "public, max-age=86400" always; try_files $uri =404; }

    # sitemap/rss/robots — short cache
    location ~* \.(xml|txt)$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # fallback for SPA-like 404 handling — static html with trailing slash
    location / {
        try_files $uri $uri/ $uri/index.html /404.html =404;
    }

    # compress
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;
}
